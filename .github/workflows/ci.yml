name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Enforce modern module layout: no legacy `mod.rs` files.
      - name: Reject legacy `mod.rs` files
        run: |
          if find src -name "mod.rs" | grep -q .; then
            echo "Error: Legacy 'mod.rs' files are not allowed. Rename to <module>.rs instead."
            find src -name "mod.rs"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: rust-analyzer, rustfmt, clippy
          cache: false

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Install run-script
        run: cargo install cargo-run-script --locked

      - name: Coverage
        run: cargo run-script coverage

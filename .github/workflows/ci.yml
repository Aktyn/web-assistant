name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Enforce modern module layout: no legacy `mod.rs` files.
      - name: Reject legacy `mod.rs` files
        run: |
          if find src -name "mod.rs" | grep -q .; then
            echo "Error: Legacy 'mod.rs' files are not allowed. Rename to <module>.rs instead."
            find src -name "mod.rs"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cargo chef: compute and cache the dependency recipe for fast builds.
      - name: Install cargo chef
        uses: jacobtomlinson/cargo-chef@v1
        with:
          install-recipe: true

      - name: Build recipe cache
        uses: jacobtomlinson/cargo-chef@v1
        with:
          use-cache: true

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      # Install cargo-tarpaulin for coverage measurement.
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      # Run coverage and enforce at least 80% line coverage.
      - name: Coverage
        run: cargo tarpaulin --out xml --fail-under 80 --exclude-files "tests/*"

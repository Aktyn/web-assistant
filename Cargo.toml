[package]
name = "web-assistant"
version = "0.1.0"
edition = "2024"

# Requires: cargo install cargo-run-script
[package.metadata.scripts]
coverage = "cargo tarpaulin"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
regex = "1"
tokio-tungstenite = { version = "0.30", features = ["connect"] }
futures-util = "0.3"
url = "2"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29.0"
clap = { version = "4.6.7", features = ["derive"] }
tui-logger = "0.18.3"
log = "0.4.35"
documented = "0.10.0"
env_logger = "0.11.11"
jsonc-parser = { version = "0.34", features = ["serde"] }
termcolor = "1.4.1"
scopeguard = "1.2.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
unused_self = "warn"
must_use_candidate = "deny"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

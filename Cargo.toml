[package]
name = "web-assistant"
version = "0.1.0"
edition = "2024"

# Requires: cargo install cargo-run-script
[package.metadata.scripts]
coverage = "cargo tarpaulin"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
tokio-tungstenite = { version = "0.30", features = ["connect"] }
futures-util = "0.3"
tempfile = "3"
url = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

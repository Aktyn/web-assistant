[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
utils = { path = "crates/utils" }
config = { path = "crates/config" }
workflow = { path = "crates/workflow" }
browser = { path = "crates/browser" }
agent = { path = "crates/agent" }
llm = { path = "crates/llm" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
regex = "1"
url = "2"
tui-logger = "0.18.3"
log = "0.4.35"
documented = "0.10.0"
env_logger = "0.11.12"
jsonc-parser = { version = "0.34", features = ["serde"] }
scopeguard = "1.2.0"
strum = { version = "0.28", features = ["derive"] }

# dev-dependencies
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
lto = false
strip = false

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
unused_self = "warn"
must_use_candidate = "deny"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
